<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal — Glittering Field Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/storage.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/dashboard-ui.js"></script>
<script src="../assets/js/fees.js"></script>
<script>const session = initDashLayout({ role: 'student', title: 'Student Portal', subtitle: 'Your subjects, results, attendance and examinations in one place.' });</script>

<template id="pageTemplate">
  <div class="tabs mb-24">
    <button class="tab-btn" data-tabkey="overview">Overview</button>
    <button class="tab-btn" data-tabkey="results">Subjects & Results</button>
    <button class="tab-btn" data-tabkey="attendance">Attendance</button>
    <button class="tab-btn" data-tabkey="exams">Examinations</button>
    <button class="tab-btn" data-tabkey="timetable">Timetable</button>
    <button class="tab-btn" data-tabkey="fees">Fees</button>
    <button class="tab-btn" data-tabkey="announcements">Announcements</button>
  </div>

  <div data-tabpanel="overview">
    <div class="card mb-24"><div class="card-body">
      <div class="flex gap-16" style="align-items:center;">
        <div class="avatar avatar-lg" id="ovAvatar"></div>
        <div><h2 class="mb-0" id="ovName"></h2><p class="text-muted mb-0" id="ovMeta"></p></div>
      </div>
    </div></div>
    <div class="stats-grid" id="overviewStats"></div>
  </div>

  <div data-tabpanel="results" style="display:none;">
    <div class="card"><div class="card-body">
      <div class="filters-bar"><select id="resTermSelect"><option>First Term</option><option>Second Term</option><option>Third Term</option></select></div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>Subject</th><th>CA</th><th>Exam</th><th>Total</th><th>Grade</th><th>Remark</th></tr></thead><tbody id="resultsBody"></tbody></table></div>
      <button class="btn btn-secondary mt-16" onclick="window.print()"><i class="fa-solid fa-print"></i> Print Report Card</button>
    </div></div>
  </div>

  <div data-tabpanel="attendance" style="display:none;">
    <div class="stats-grid" id="attStats"></div>
    <div class="card"><div class="card-body"><div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Status</th></tr></thead><tbody id="attBody"></tbody></table></div></div></div>
  </div>

  <div data-tabpanel="exams" style="display:none;">
    <div class="grid-3" id="examsGrid"></div>
  </div>

  <div data-tabpanel="timetable" style="display:none;">
    <div class="card"><div class="card-body table-wrap" id="ttContainer"></div></div>
  </div>

  <div data-tabpanel="fees" style="display:none;">
    <div id="feeContainer"></div>
  </div>

  <div data-tabpanel="announcements" style="display:none;">
    <div class="card"><div class="card-body" id="annList"></div></div>
  </div>
</template>

<script>
document.getElementById('dashContent').innerHTML = document.getElementById('pageTemplate').innerHTML;
document.body.insertAdjacentHTML('beforeend', PAYMENT_MODAL_HTML);

const db = DB.load();
const student = db.students.find(s => s.id === session.refId) || db.students[0];

document.getElementById('ovAvatar').textContent = initials(student.firstName, student.lastName);
document.getElementById('ovName').textContent = fullName(student);
document.getElementById('ovMeta').textContent = `${student.admissionNo} · ${studentClassLabel(student)}`;

const myResults = db.results.filter(r => r.studentId === student.id);
const myAttendance = db.attendance.filter(a => a.studentId === student.id);
const rate = myAttendance.length ? Math.round(myAttendance.filter(a=>a.status==='Present').length/myAttendance.length*100) : 0;
const avgScore = myResults.length ? Math.round(myResults.reduce((s,r)=>s+r.total,0)/myResults.length) : 0;
const invoice = db.invoices.find(i => i.studentId === student.id);
const myExams = db.exams.filter(e => e.class === student.class);
const myAttempts = (db.examAttempts||[]).filter(a => a.studentId === student.id);

document.getElementById('overviewStats').innerHTML = `
  <div class="stat-card"><div class="icon icon-navy"><i class="fa-solid fa-chart-line"></i></div><div class="value">${avgScore}%</div><div class="label">Average Score</div></div>
  <div class="stat-card"><div class="icon icon-green"><i class="fa-solid fa-calendar-check"></i></div><div class="value">${rate}%</div><div class="label">Attendance Rate</div></div>
  <div class="stat-card"><div class="icon icon-gold"><i class="fa-solid fa-sack-dollar"></i></div><div class="value">${invoice?formatCurrency(invoice.balance):'₦0'}</div><div class="label">Fees Balance</div></div>
  <div class="stat-card"><div class="icon icon-purple"><i class="fa-solid fa-laptop"></i></div><div class="value">${myExams.length}</div><div class="label">Available Examinations</div></div>`;

// Results tab
function renderResults() {
  const term = document.getElementById('resTermSelect').value;
  const results = myResults.filter(r => r.term === term);
  document.getElementById('resultsBody').innerHTML = results.map(r => `<tr><td>${r.subject}</td><td>${r.ca}</td><td>${r.exam}</td><td>${r.total}</td><td><span class="badge badge-${r.grade==='F'?'danger':r.grade==='A'?'success':'gray'}">${r.grade}</span></td><td>${r.remark}</td></tr>`).join('') || '<tr><td colspan="6" class="text-muted">No results recorded for this term yet.</td></tr>';
}
document.getElementById('resTermSelect').addEventListener('change', renderResults);
renderResults();

// Attendance tab
const present = myAttendance.filter(a=>a.status==='Present').length, absent = myAttendance.filter(a=>a.status==='Absent').length, late = myAttendance.filter(a=>a.status==='Late').length;
document.getElementById('attStats').innerHTML = `
  <div class="stat-card"><div class="icon icon-green"><i class="fa-solid fa-check"></i></div><div class="value">${present}</div><div class="label">Days Present</div></div>
  <div class="stat-card"><div class="icon icon-navy"><i class="fa-solid fa-xmark"></i></div><div class="value">${absent}</div><div class="label">Days Absent</div></div>
  <div class="stat-card"><div class="icon icon-gold"><i class="fa-solid fa-clock"></i></div><div class="value">${late}</div><div class="label">Days Late</div></div>
  <div class="stat-card"><div class="icon icon-purple"><i class="fa-solid fa-percent"></i></div><div class="value">${rate}%</div><div class="label">Attendance Rate</div></div>`;
document.getElementById('attBody').innerHTML = myAttendance.slice().reverse().slice(0,20).map(a => `<tr><td>${formatDate(a.date)}</td><td><span class="badge badge-${statusBadgeClass(a.status)}">${a.status}</span></td></tr>`).join('');

// Exams tab
document.getElementById('examsGrid').innerHTML = myExams.map(e => {
  const attempt = myAttempts.find(a => a.examId === e.id);
  return `<div class="card card-body">
    <span class="badge badge-purple">${e.subject}</span>
    <h4 class="mt-8">${e.title}</h4>
    <p class="text-muted text-sm">${e.questions.length} Questions &middot; ${e.durationMinutes} mins</p>
    ${attempt ? `<div class="alert alert-success" style="margin-bottom:12px;"><i class="fa-solid fa-circle-check"></i> Completed — Score: ${attempt.score}/${e.questions.length}</div><button class="btn btn-secondary btn-block" disabled>Already Submitted</button>`
      : `<button class="btn btn-primary btn-block" onclick="window.location.href='exam.html?id=${e.id}'"><i class="fa-solid fa-play"></i> Start Exam</button>`}
  </div>`;
}).join('') || '<p class="text-muted">No examinations available for your class right now.</p>';

// Timetable
const ttKey = studentClassLabel(student);
const ttData = db.timetable[ttKey];
if (ttData) {
  const days = Object.keys(ttData);
  const periods = ttData[days[0]].map(p => p.period);
  let html = '<table class="data-table" style="min-width:800px;"><thead><tr><th>Time</th>' + days.map(d=>`<th>${d}</th>`).join('') + '</tr></thead><tbody>';
  periods.forEach((period, pi) => { html += `<tr><td><strong>${period}</strong></td>` + days.map(d => { const cell = ttData[d][pi]; return cell.subject==='BREAK' ? '<td style="background:var(--gold-100);font-weight:700;text-align:center;">BREAK</td>' : `<td>${cell.subject}<br><span class="text-muted" style="font-size:.72rem;">${cell.teacher}</span></td>`; }).join('') + '</tr>'; });
  html += '</tbody></table>';
  document.getElementById('ttContainer').innerHTML = html;
} else {
  document.getElementById('ttContainer').innerHTML = '<p class="text-muted">Timetable not yet published for your class.</p>';
}

// Fees
function renderFee() {
  if (!invoice) { document.getElementById('feeContainer').innerHTML = '<p class="text-muted">No invoice found.</p>'; return; }
  document.getElementById('feeContainer').innerHTML = `<div class="card"><div class="card-header"><h3>Invoice ${invoice.id}</h3><span class="badge badge-${statusBadgeClass(invoice.status)}">${invoice.status}</span></div>
  <div class="card-body">
    <table class="data-table" style="min-width:0;"><tbody>
      ${invoice.items.map(it => `<tr><td>${it.category}</td><td style="text-align:right;">${formatCurrency(it.amount)}</td></tr>`).join('')}
      <tr style="font-weight:800;border-top:2px solid var(--gray-200);"><td>Total</td><td style="text-align:right;">${formatCurrency(invoice.total)}</td></tr>
      <tr><td>Paid</td><td style="text-align:right;color:var(--success);">${formatCurrency(invoice.paid)}</td></tr>
      <tr><td>Balance</td><td style="text-align:right;color:var(--danger);">${formatCurrency(invoice.balance)}</td></tr>
    </tbody></table>
    ${invoice.balance > 0 ? `<button class="btn btn-primary btn-block mt-16" onclick="startPaymentFlow('${invoice.id}', renderFee)"><i class="fa-solid fa-credit-card"></i> Pay Fees</button>` : `<div class="alert alert-success mt-16"><i class="fa-solid fa-circle-check"></i> Fully paid.</div>`}
  </div></div>`;
}
renderFee();

// Announcements
document.getElementById('annList').innerHTML = db.announcements.filter(a => a.audience === 'Students' || a.audience === 'All Parents').slice().reverse().map(a => `
  <div class="activity-item"><div class="dot-icon icon-purple" style="background:#efe8fb;color:var(--purple-600);"><i class="fa-solid fa-bullhorn"></i></div><div><p><strong>${a.title}</strong><br>${a.content}</p><span>${formatDate(a.date)}</span></div></div>`).join('') || '<p class="text-muted">No announcements yet.</p>';

initHashTabs('overview');
</script>
</body>
</html>
