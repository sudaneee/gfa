{% extends "base_dashboard.html" %}
{% block title %}Delete — {{ school.name }}{% endblock %}
{% block dash_title %}Confirm Delete{% endblock %}

{% block dash_content %}
<div class="card" style="max-width:520px;"><div class="card-body">
  <div class="alert alert-warning"><i class="fa-solid fa-triangle-exclamation"></i> This can't be undone.</div>
  <p>Delete <strong>{{ label }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <div class="flex gap-12 mt-16">
      <button type="submit" class="btn btn-primary" style="background:var(--danger);border-color:var(--danger);"><i class="fa-solid fa-trash"></i> Delete</button>
      <a href="{% url cancel_url %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
